# ──────────────────────────────────────────────────────────────────────────────
# ci.yml — Akshara ATS Continuous Integration
#
# Runs on every push and pull_request targeting main.
# ALL jobs must pass before deploy.yml is permitted to run.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │ MANUAL TODO — Branch Protection (cannot be automated):             │
# │                                                                     │
# │ 1. Go to: GitHub → Settings → Branches → main                     │
# │ 2. Enable: "Require status checks to pass before merging"          │
# │ 3. Add required check: "deploy-optimization"                       │
# │ 4. Enable: "Require branches to be up to date before merging"      │
# │ 5. Enable: "Do not allow bypassing the above settings"             │
# └─────────────────────────────────────────────────────────────────────┘
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Install dependencies (cached) ──────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        id: cache-frontend
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}

      - name: Cache backend node_modules
        uses: actions/cache@v4
        id: cache-backend
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        if: steps.cache-backend.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci

  # ── Job 2: Lint both apps ─────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore frontend cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}

      - name: Restore backend cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}

      - name: Frontend — TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Backend — ESLint
        working-directory: backend
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
            npx eslint src/ --ext .js --max-warnings 0
          else
            echo "No ESLint config found, skipping"
          fi

      - name: Frontend — ESLint
        working-directory: frontend
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.cjs" ] || [ -f ".eslintrc.json" ]; then
            npx eslint src/ --ext .jsx,.tsx,.js,.ts --max-warnings 0
          else
            echo "No ESLint config found, skipping"
          fi

  # ── Job 3: Run 30 automated tests against Neon CI test branch ────────────
  test:
    name: Run Test Suite (30 tests)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: local_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEON_TEST_DATABASE_URL: 'postgresql://postgres:password@localhost:5432/local_test_db'
      DATABASE_URL: 'postgresql://postgres:password@localhost:5432/local_test_db'
      JWT_SECRET: ci-test-jwt-secret-${{ github.run_id }}
      PORT: 4001
      CORS_ORIGIN: http://localhost:4001

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore backend cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend deps (if cache miss)
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Push schema to Neon CI test branch
        working-directory: backend
        run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: 'postgresql://postgres:password@localhost:5432/local_test_db'

      - name: Run backend test suite (Tests 1-28)
        working-directory: backend
        run: npm run test:ci
        env:
          NEON_TEST_DATABASE_URL: 'postgresql://postgres:password@localhost:5432/local_test_db'
          DATABASE_URL: 'postgresql://postgres:password@localhost:5432/local_test_db'
          JWT_SECRET: ci-test-jwt-secret-${{ github.run_id }}

      - name: Restore frontend cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps (if cache miss)
        working-directory: frontend
        run: npm ci

      # Tests 29-30 (build.test.js) require dist/assets/ to exist — build first.
      # VITE_API_URL is intentionally omitted here; the test only checks chunk sizes,
      # not API connectivity, so a placeholder value is sufficient.
      - name: Build frontend (required for Tests 29-30)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ats-sales-backend.onrender.com' }}

      - name: Run frontend test suite (Tests 29-30)
        working-directory: frontend
        run: npm run test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            backend/jest-results.json
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 4: Build both apps ────────────────────────────────────────────────
  build:
    name: Build Frontend & Backend
    runs-on: ubuntu-latest
    needs: test
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ats-sales-backend.onrender.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore frontend cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps (if cache miss)
        working-directory: frontend
        run: npm ci

      - name: Restore backend cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend deps (if cache miss)
        working-directory: backend
        run: npm ci

      - name: Frontend — TypeScript + Vite production build
        working-directory: frontend
        run: npm run build

      - name: Backend — Generate Prisma client (production)
        working-directory: backend
        run: npx prisma generate

      - name: Check frontend bundle size vs budget
        run: node scripts/check-bundle-size.js

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 1

  # ── Job 5: Deploy optimization checks ────────────────────────────────────
  deploy-optimization:
    name: Deploy Optimization Checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore frontend cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}

      - name: Restore backend cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}

      - name: Install frontend deps (if cache miss)
        working-directory: frontend
        run: npm ci

      - name: Install backend deps (if cache miss)
        working-directory: backend
        run: npm ci

      - name: Frontend — Check required build-time env vars
        run: |
          echo "Checking required Vercel/Vite environment variables..."
          MISSING=()
          # Add any VITE_* vars your app requires at build time here:
          # if [ -z "${{ secrets.VITE_API_URL }}" ]; then MISSING+=("VITE_API_URL"); fi
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing required build-time env vars: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required build-time env vars are present"

      - name: Frontend — npm audit (high/critical only)
        working-directory: frontend
        run: npm audit --audit-level=high --json > /tmp/frontend-audit.json || true
        continue-on-error: true

      - name: Frontend — Print audit summary
        run: |
          if [ -f /tmp/frontend-audit.json ]; then
            node -e "
              const a = JSON.parse(require('fs').readFileSync('/tmp/frontend-audit.json', 'utf8'));
              const v = a.metadata?.vulnerabilities || {};
              const high = (v.high || 0) + (v.critical || 0);
              console.log('Frontend audit summary:', JSON.stringify(v));
              if (high > 0) { console.warn('⚠️ WARNING: ' + high + ' HIGH/CRITICAL vulnerabilities found in frontend.'); }
              else { console.log('✅ No high/critical vulnerabilities in frontend'); }
            "
          fi

      - name: Backend — npm audit (high/critical only)
        working-directory: backend
        run: npm audit --audit-level=high --json > /tmp/backend-audit.json || true
        continue-on-error: true

      - name: Backend — Print audit summary
        run: |
          if [ -f /tmp/backend-audit.json ]; then
            node -e "
              const a = JSON.parse(require('fs').readFileSync('/tmp/backend-audit.json', 'utf8'));
              const v = a.metadata?.vulnerabilities || {};
              const high = (v.high || 0) + (v.critical || 0);
              console.log('Backend audit summary:', JSON.stringify(v));
              if (high > 0) { console.warn('⚠️ WARNING: ' + high + ' HIGH/CRITICAL vulnerabilities found in backend.'); }
              else { console.log('✅ No high/critical vulnerabilities in backend'); }
            "
          fi

      - name: Backend — Verify production start command exists
        run: |
          CMD=$(node -e "const p=require('./backend/package.json'); console.log(p.scripts.start || '')")
          if [ -z "$CMD" ]; then
            echo "❌ No 'start' script in backend/package.json"
            exit 1
          fi
          echo "✅ Production start command: $CMD"

      - name: Backend — Verify health endpoint in source
        run: |
          # The health route is registered in app.js (not index.js — index.js only bootstraps the HTTP server).
          # Match the actual pattern: app.get('/api/health',
          if grep -q "'/api/health'" backend/src/app.js || grep -q '"/api/health"' backend/src/app.js; then
            echo "✅ /api/health endpoint found in backend/src/app.js"
          else
            echo "❌ /api/health endpoint not found in backend/src/app.js"
            echo "Searched for: app.get('/api/health',...) or app.get(\"...\") patterns"
            exit 1
          fi

      - name: Backend — Verify no dev-only deps required at runtime
        working-directory: backend
        run: |
          echo "Checking that production deps are not in devDependencies..."
          node -e "
            const pkg = require('./package.json');
            const devDeps = Object.keys(pkg.devDependencies || {});
            const src = require('fs').readFileSync('./src/index.js', 'utf8');
            const devImported = devDeps.filter(d => src.includes(d + \"'\") || src.includes('\"' + d + '\"'));
            if (devImported.length > 0) {
              console.warn('⚠️  Dev deps possibly used in main source:', devImported);
            } else {
              console.log('✅ No dev-only deps found in src/index.js');
            }
          "

  # ── Job 6: Post CI summary comment on PR ─────────────────────────────────
  report:
    name: Post CI Summary
    runs-on: ubuntu-latest
    needs: [install, lint, test, build, deploy-optimization]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post test results comment
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              install: '${{ needs.install.result }}',
              lint: '${{ needs.lint.result }}',
              test: '${{ needs.test.result }}',
              build: '${{ needs.build.result }}',
              deploy_optimization: '${{ needs.deploy-optimization.result }}',
            };

            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const allPassed = Object.values(jobs).every(r => r === 'success' || r === 'skipped');

            const testGroups = [
              { name: 'A. Auth & Authorization (Tests 1-4)',        result: jobs.test },
              { name: 'B. Candidate & Interview CRUD (Tests 5-9)',  result: jobs.test },
              { name: 'C. Calendar Timezone Correctness (Tests 10-14) — CRITICAL', result: jobs.test },
              { name: 'D. List View (Tests 15-17)',                 result: jobs.test },
              { name: 'E. Excel Import/Export (Tests 18-21)',       result: jobs.test },
              { name: 'F. Backend API Integration (Tests 22-25)',   result: jobs.test },
              { name: 'G. Security (Tests 26-28)',                  result: jobs.test },
              { name: 'H. Build & Performance (Tests 29-30)',       result: jobs.test },
            ];

            const body = `## ${allPassed ? '✅ CI Passed' : '❌ CI Failed'} — Akshara ATS

            | Job | Status |
            |-----|--------|
            | Install Dependencies | ${icon(jobs.install)} ${jobs.install} |
            | Lint & Type-check | ${icon(jobs.lint)} ${jobs.lint} |
            | Test Suite (30 tests) | ${icon(jobs.test)} ${jobs.test} |
            | Build Frontend & Backend | ${icon(jobs.build)} ${jobs.build} |
            | Deploy Optimization | ${icon(jobs.deploy_optimization)} ${jobs.deploy_optimization} |

            ### Test Suite Breakdown (30 tests)

            ${testGroups.map(g => `- ${icon(g.result)} ${g.name}`).join('\n')}

            > ${allPassed
              ? '🚀 All checks passed. Deploy will proceed automatically on merge to main.'
              : '🚫 One or more checks failed. Deploy is **blocked**. Fix the failing jobs before merging.'}

            [View full logs →](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
