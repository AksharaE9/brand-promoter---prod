# ──────────────────────────────────────────────────────────────────────────────
# pr-preview.yml — Vercel Preview Deploy on Pull Requests
#
# Triggered on every PR targeting main.
# Posts a preview URL comment so reviewers can test the PR in a live environment.
# Does NOT deploy to Render (backend preview not applicable here).
# ──────────────────────────────────────────────────────────────────────────────
name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-deploy:
    name: Deploy Vercel Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      preview-url: ${{ steps.vercel-preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore frontend cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (preview)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy Vercel preview (not production)
        id: vercel-preview
        working-directory: frontend
        run: |
          npm install -g vercel@latest
          DEPLOY_URL=$(vercel --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --yes 2>&1 | grep -oP 'https://[^\s]+' | tail -1)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.vercel-preview.outputs.url }}';

            const body = `## 🔍 Preview Deployment Ready

            | Property | Value |
            |----------|-------|
            | **Preview URL** | [${previewUrl}](${previewUrl}) |
            | **Branch** | \`${{ github.head_ref }}\` |
            | **Commit** | \`${{ github.event.pull_request.head.sha }}\` |

            > ℹ️ This is a Vercel **preview deployment** — it uses the production backend but is not the production frontend URL.
            > Merging this PR will trigger a full production deploy only after CI passes.`;

            // Check for existing preview comment to update it (avoid duplicate comments)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment Ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
