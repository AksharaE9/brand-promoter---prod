name: CD

# ──────────────────────────────────────────────────────────────────────────────
# cd.yml — Artifact build for CD pipeline
#
# This workflow builds deployable artifacts ONLY after the CI workflow
# has passed successfully on main. Previously it triggered independently
# on every push to main, which meant a broken push could trigger both a
# failing CI and a successful artifact build simultaneously.
#
# gate: triggered by workflow_run (same guard used by deploy.yml)
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    # Only build artifacts when CI passed (not when it failed or was cancelled)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ats-sales-backend.onrender.com' }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-src
          path: |
            backend/src
            backend/prisma
            backend/package.json
            backend/package-lock.json

  deployment-placeholder:
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    steps:
      - name: Deployment step
        run: echo "Replace this step with your hosting deployment command (Render/Railway/Azure/AWS)."
